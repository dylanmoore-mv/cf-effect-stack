name: ci
on:
  workflow_call:
    inputs:
      env: { required: true, type: string }                 # staging | prod
      preview: { required: false, type: boolean, default: false }

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:ci@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check

  migrate:
    needs: check
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/db drizzle-kit migrate
        env: { DATABASE_URL: "${{ secrets.DATABASE_DIRECT_URL }}" }

  deploy:
    needs: [check, migrate]
    if: ${{ always() && needs.check.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'preview' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/web build
      - id: deploy
        working-directory: apps/web
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            out=$(pnpm wrangler versions upload --env "${{ inputs.env }}" --preview-alias "pr-${{ github.event.number }}")
            echo "$out"
            echo "url=$(echo "$out" | grep -o 'https://[^ ]*workers.dev' | head -1)" >> "$GITHUB_OUTPUT"
          else
            pnpm wrangler deploy --env "${{ inputs.env }}"
            echo "url=${{ vars.APP_URL }}" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}" }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { BASE_URL: "${{ needs.deploy.outputs.url }}", E2E_RUN_ID: "${{ github.run_id }}" }
